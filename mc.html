<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        visibility: hidden;
      }
    </style>
    <title>MC Bill</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>💎</text></svg>"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f5f0;
        --surface: #ffffff;
        --surface-2: #f9f9f6;
        --ink: #1a1a2e;
        --ink-2: #444466;
        --ink-3: #8888aa;
        --blue: #1d6fa4;
        --amber: #b5620a;
        --amber-light: #fef0d6;
        --border: rgba(0, 0, 0, 0.08);
        --border-strong: rgba(0, 0, 0, 0.14);
        --radius-lg: 16px;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.04);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-3);
        text-decoration: none;
        padding: 5px 10px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--surface);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .back-btn:hover {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      .topbar-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--ink);
      }
      .topbar-sub {
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 1px;
      }

      .content {
        flex: 1;
        padding: 28px 28px 40px;
        max-width: 980px;
        width: 100%;
        margin: 0 auto;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .card-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .card-header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
      }
      .badge-count {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 20px;
        background: var(--amber-light);
        color: var(--amber);
      }

      .btn-invoice {
        display: none;
        align-items: center;
        gap: 7px;
        padding: 8px 16px;
        background: #1a3a5c;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
        letter-spacing: 0.02em;
      }
      .btn-invoice:hover {
        background: #215f9a;
      }
      .btn-invoice.visible {
        display: inline-flex;
      }

      .filters {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter-input {
        padding: 6px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        font-size: 12.5px;
        font-family: inherit;
        background: var(--surface);
        color: var(--ink);
        outline: none;
      }
      .filter-input:focus {
        border-color: var(--blue);
      }
      .filter-label {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      select.filter-input {
        cursor: pointer;
        padding-right: 28px;
      }

      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead th {
        background: var(--surface-2);
        color: var(--ink-3);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 10px 13px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      thead th:first-child {
        width: 40px;
        text-align: center;
        padding: 10px 8px;
      }
      thead th:last-child {
        text-align: center;
      }
      tbody tr:hover td {
        background: var(--surface-2);
      }
      tbody td {
        padding: 10px 13px;
        border-bottom: 1px solid var(--border);
        color: var(--ink);
        vertical-align: middle;
      }
      tbody td:first-child {
        text-align: center;
        padding: 10px 8px;
      }
      tbody td:last-child {
        text-align: center;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      input[type="checkbox"] {
        width: 15px;
        height: 15px;
        cursor: pointer;
        accent-color: var(--blue);
      }
      .company-name {
        font-weight: 600;
        font-size: 13px;
      }
      .issue-no {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
        margin-top: 2px;
      }
      .weight-cell {
        font-family: "DM Mono", monospace;
        font-size: 13px;
        font-weight: 600;
        color: var(--blue);
      }
      .status-gen {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 12px;
        background: #d1fae5;
        color: #065f46;
      }
      .status-new {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 12px;
        background: #e8edf2;
        color: #374151;
      }
      .empty-state {
        text-align: center;
        padding: 48px 20px;
        color: var(--ink-3);
        font-size: 13px;
      }
      .loading-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--ink-3);
        font-size: 13px;
      }

      .summary-bar {
        padding: 12px 20px;
        border-top: 1px solid var(--border);
        background: var(--surface-2);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--ink-2);
      }
      .summary-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .summary-item .val {
        font-family: "DM Mono", monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--blue);
      }

      /* Modal */
      dialog.inv-dialog {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        border: none;
        padding: 0;
        overflow: hidden;
      }
      dialog.inv-dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(3px);
      }
      .modal-hdr {
        padding: 16px 20px 13px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: var(--ink-3);
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
      }
      .modal-close:hover {
        background: var(--surface-2);
        color: var(--ink);
      }
      .modal-body {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .field-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .field input {
        padding: 8px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        font-size: 13px;
        font-family: inherit;
        color: var(--ink);
        background: var(--surface);
        outline: none;
        width: 100%;
      }
      .field input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(29, 111, 164, 0.1);
      }
      .field-hint {
        font-size: 10px;
        color: var(--ink-3);
      }
      .inv-preview {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 11px 13px;
        font-size: 12px;
        color: var(--ink-2);
        line-height: 1.75;
      }
      .modal-footer {
        padding: 12px 20px 15px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 9px;
        justify-content: flex-end;
      }
      .btn-cancel {
        padding: 7px 15px;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink-2);
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .btn-cancel:hover {
        background: var(--surface-2);
      }
      .btn-generate {
        padding: 7px 16px;
        border: none;
        border-radius: 7px;
        background: #1a3a5c;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .btn-generate:hover {
        background: #215f9a;
      }
      .btn-view {
        padding: 4px 11px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--blue);
        font-size: 11.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-view:hover {
        background: var(--surface-2);
      }
      .btn-del-mc {
        padding: 4px 10px;
        border: 1px solid #fca5a5;
        border-radius: 6px;
        background: #fff5f5;
        color: #dc2626;
        font-size: 11.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-del-mc:hover {
        background: #fee2e2;
      }
      dialog.view-dialog {
        width: 100%;
        max-width: 620px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        border: none;
        padding: 0;
        overflow: hidden;
      }
      dialog.view-dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(3px);
      }
      .vd-items-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 4px;
      }
      .vd-items-table thead th {
        padding: 6px 8px;
        background: var(--surface-2);
        color: var(--ink-3);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .vd-items-table thead th:not(:first-child):not(:nth-child(2)) { text-align: right; }
      .vd-items-table tbody td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        color: var(--ink);
        vertical-align: middle;
      }
      .vd-items-table tbody td:not(:first-child):not(:nth-child(2)) {
        text-align: right;
        font-family: "DM Mono", monospace;
      }
      .vd-items-table tbody tr:last-child td { border-bottom: none; }
      .vd-fields {
        display: grid;
        gap: 10px;
      }
      .vd-field label {
        font-size: 10px;
        font-weight: 700;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: block;
        margin-bottom: 2px;
      }
      .vd-field .vd-val {
        font-size: 13px;
        color: var(--ink);
      }
      .vd-section-label {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a href="/dashboard" class="back-btn">
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Dashboard
      </a>
      <div>
        <div class="topbar-title">MC Bill</div>
        <div class="topbar-sub">Others — Issue Vouchers</div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-header">
          <div class="card-header-left">
            <div class="card-title">Issue Vouchers</div>
            <span class="badge-count" id="totalBadge">—</span>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              flex-wrap: wrap;
            "
          >
            <input
              class="filter-input"
              id="searchInput"
              placeholder="Search company or issue no."
              oninput="applyFilter()"
              style="min-width: 190px"
            />
            <button
              class="btn-invoice"
              id="createInvoiceBtn"
              onclick="openInvoiceModal()"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
              Create MC Invoice
            </button>
          </div>
        </div>

        <div class="filters">
          <span class="filter-label">From</span>
          <input
            type="date"
            class="filter-input"
            id="fromDate"
            onchange="applyFilter()"
          />
          <span class="filter-label">To</span>
          <input
            type="date"
            class="filter-input"
            id="toDate"
            onchange="applyFilter()"
          />
          <select
            class="filter-input"
            id="companyFilter"
            onchange="applyFilter()"
            style="min-width: 160px"
          >
            <option value="">All Companies</option>
          </select>
          <select
            class="filter-input"
            id="generatedFilter"
            onchange="applyFilter()"
          >
            <option value="">All Status</option>
            <option value="not_generated" selected>Not Generated</option>
            <option value="generated">Generated</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>
                  <input
                    type="checkbox"
                    id="selectAll"
                    title="Select all"
                    onchange="toggleSelectAll(this.checked)"
                  />
                </th>
                <th>Company / Issue No.</th>
                <th>Issue Date</th>
                <th>Weight (g)</th>
                <th style="text-align:center">Status</th>
                <th>View</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="6" class="loading-state">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="summary-bar">
          <div class="summary-item">
            Selected: <span class="val" id="selCount">0</span>
          </div>
          <div class="summary-item">
            Total Weight: <span class="val" id="selWeight">0.000</span> g
          </div>
          <div class="summary-item" style="color: var(--ink-3)">
            Showing <span id="showingCount">0</span> of
            <span id="totalCount">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- View Dialog -->
    <dialog id="viewDialog" class="view-dialog" aria-labelledby="vdTitle">
      <div class="modal-hdr">
        <div>
          <div class="modal-title" id="vdTitle">MC Bill</div>
          <div id="vdSubtitle" style="font-size:11px;color:var(--ink-3);margin-top:2px;"></div>
        </div>
        <button class="modal-close" onclick="closeViewDialog()">✕</button>
      </div>
      <div id="vdBody" class="modal-body" style="max-height:68vh;overflow-y:auto;"></div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeViewDialog()">Close</button>
        <button id="vdActionBtn" class="btn-generate" onclick="goEditFromView()">Edit →</button>
      </div>
    </dialog>

    <!-- Invoice Modal — only Date, Gold Rate, Percentage -->
    <dialog id="invoiceDialog" class="inv-dialog" aria-labelledby="modalTitle">
      <div class="modal-hdr">
        <div class="modal-title" id="modalTitle">Create MC Invoice</div>
        <button class="modal-close" onclick="closeInvoiceModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="field-3">
          <div class="field">
            <label for="invDate">Invoice Date</label>
            <input type="date" id="invDate" oninput="refreshPreview()" />
          </div>
          <div class="field">
            <label for="invGoldRate">Gold Rate (₹/10g)</label>
            <input
              type="number"
              id="invGoldRate"
              placeholder="e.g. 98770"
              step="1"
              min="0"
              oninput="refreshPreview()"
            />
          </div>
          <div class="field">
            <label for="invPct">Percentage (%)</label>
            <input
              type="number"
              id="invPct"
              placeholder="3.5"
              step="0.01"
              min="0"
              oninput="refreshPreview()"
            />
            <div class="field-hint">Default 3.5%</div>
          </div>
        </div>
        <div class="field-3">
          <div class="field">
            <label for="invNo">Invoice No.</label>
            <input
              type="number"
              id="invNo"
              readonly
              tabindex="-1"
              style="background:var(--surface-2);cursor:default;color:var(--ink);font-family:'DM Mono',monospace;font-weight:600;"
            />
          </div>
        </div>
        <div class="inv-preview" id="invPreview" style="color: var(--ink-3)">
          Enter gold rate and percentage to preview.
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeInvoiceModal()">Cancel</button>
        <button class="btn-generate" onclick="generateInvoice()">
          Generate &amp; Print →
        </button>
      </div>
    </dialog>

    <script>
      (function () {
        const u =
          localStorage.getItem("auth_user") ||
          sessionStorage.getItem("auth_user");
        const exp = localStorage.getItem("auth_exp");
        if (!u || (exp && Date.now() >= Number.parseInt(exp))) {
          globalThis.location.replace("/login");
        } else {
          document.body.style.visibility = "visible";
        }
      })();

      let allData = [];
      let filteredData = [];

      // ── MC bill number helpers ──
      const _MC_PREFIX_MAP = {
        "VIGNESH NAMACHIVAYAM MC": "VN",
        "VIMAL HUF MC":            "VH",
        "VIMAL MC":                "V",
        "NAMACHIVAYAM HUF":        "NH",
      };
      function getMcPrefix(companyName) {
        const key = String(companyName || "").trim().toUpperCase();
        // Check exact match first (case-insensitive)
        for (const [k, v] of Object.entries(_MC_PREFIX_MAP)) {
          if (k === key) return `${v}-MC/`;
        }
        // Fallback: initials of each word, strip trailing MC/HUF/etc.
        const _trail = new Set(["MC","HUF","PVT","LTD","JEWELLERY","JEWELLERS","JEWELERS","TRADERS","ENTERPRISES","CO","COMPANY","BROS","BROTHERS"]);
        const words = key.split(/\s+/).filter(Boolean);
        while (words.length > 1 && _trail.has(words[words.length - 1])) words.pop();
        const initials = words.filter(w => w !== "AND" && w !== "&").map(w => w[0]).join("");
        if (initials) return `${initials}-MC/`;
        return `${(words[0] || "").slice(0, 2)}-MC/` || "MC/";
      }
      function parseMcBillNum(billNo) {
        const m = /(\d+)$/.exec(billNo || "");
        return m ? parseInt(m[1], 10) : 0;
      }

      // ── Generated tracking (DB-backed via mc_receipt_id; localStorage fallback for pre-migration data) ──
      function isGenerated(id) {
        const row = allData.find((r) => String(r.id) === String(id));
        return !!(row?.mc_receipt_id) || !!(getMcBillData(id)?.receiptId);
      }
      function markGenerated(ids, receiptId, extras = {}) {
        ids.forEach((id) => {
          const row = allData.find((r) => String(r.id) === String(id));
          if (row) Object.assign(row, { mc_receipt_id: receiptId }, extras);
        });
      }
      async function unmarkGenerated(ids) {
        const firstRow = allData.find((r) => String(r.id) === String(ids[0]));
        const receiptId = firstRow?.mc_receipt_id || getMcBillData(ids[0])?.receiptId;
        if (receiptId) {
          try {
            await fetch(`/api/labour/${receiptId}`, { method: "DELETE" });
          } catch (e) {
            console.warn("[MC] Delete receipt failed:", e.message);
          }
          allData.forEach((row) => {
            if (String(row.mc_receipt_id) === String(receiptId)) row.mc_receipt_id = null;
          });
        }
        ids.forEach((id) => removeMcBillData(id));
      }

      async function loadData() {
        try {
          const res = await fetch("/api/labour/mc-bill-issues");
          allData = res.ok ? await res.json() : [];
          populateCompanyDropdown();
          applyFilter();
        } catch {
          document.getElementById("tableBody").innerHTML =
            '<tr><td colspan="5" class="empty-state">Failed to load data.</td></tr>';
        }
      }

      function populateCompanyDropdown() {
        const companies = [
          ...new Set(allData.map((r) => r.company_name).filter(Boolean)),
        ].sort();
        const sel = document.getElementById("companyFilter");
        sel.innerHTML =
          '<option value="">All Companies</option>' +
          companies.map((c) => `<option value="${c}">${c}</option>`).join("");
      }

      function applyFilter() {
        const q = (document.getElementById("searchInput").value || "")
          .toLowerCase()
          .trim();
        const from = document.getElementById("fromDate").value;
        const to = document.getElementById("toDate").value;
        const company = document.getElementById("companyFilter").value;
        const genF = document.getElementById("generatedFilter").value;

        filteredData = allData.filter((r) => {
          if (
            q &&
            !(r.company_name || "").toLowerCase().includes(q) &&
            !(r.issue_number || "").toLowerCase().includes(q)
          )
            return false;
          if (from && r.date && r.date.slice(0, 10) < from) return false;
          if (to && r.date && r.date.slice(0, 10) > to) return false;
          if (company && r.company_name !== company) return false;
          if (genF === "generated" && !isGenerated(r.id)) return false;
          if (genF === "not_generated" && isGenerated(r.id)) return false;
          return true;
        });
        renderTable();
      }

      function renderTable() {
        const tbody = document.getElementById("tableBody");
        document.getElementById("totalBadge").textContent = allData.length;
        document.getElementById("totalCount").textContent = allData.length;
        document.getElementById("showingCount").textContent =
          filteredData.length;

        if (!filteredData.length) {
          tbody.innerHTML =
            '<tr><td colspan="6" class="empty-state">No OTHERS issue vouchers found.</td></tr>';
          updateSummary();
          return;
        }

        tbody.innerHTML = filteredData
          .map((r) => {
            const dt = r.date
              ? new Date(r.date).toLocaleDateString("en-GB")
              : "—";
            const wt = Number.parseFloat(r.total_weight || 0).toFixed(3);
            const gen = isGenerated(r.id);
            const badge = gen
              ? '<span class="status-gen">Generated</span>'
              : '<span class="status-new">Not Generated</span>';
            const editOnclick = gen
              ? `editMcBill(${r.id})`
              : `location.href='/labour?edit=${r.id}'`;
            const actionCell = `<div style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap;">
                <button class="btn-view" onclick="openViewDialog(${r.id})">View</button>
                <button class="btn-view" style="color:var(--amber);border-color:rgba(181,98,10,0.3);" onclick="${editOnclick}">Edit</button>
                ${gen ? `<button class="btn-del-mc" onclick="confirmDeleteMcBill(${r.id}, event)">Delete</button>` : ""}
              </div>`;
            return `<tr>
            <td><input type="checkbox" class="row-chk"
              data-id="${r.id}"
              data-weight="${r.total_weight || 0}"
              data-company="${(r.company_name || "").replaceAll('"', "&quot;")}"
              data-issue="${(r.issue_number || "").replaceAll('"', "&quot;")}"
              data-date="${r.date ? r.date.slice(0, 10) : ""}"
              onchange="updateSummary()"
              ${gen ? 'disabled title="Already generated"' : ""} /></td>
            <td>
              <div class="company-name">${r.company_name || "—"}</div>
              <div class="issue-no">${r.issue_number || ""}</div>
            </td>
            <td>${dt}</td>
            <td class="weight-cell">${wt} g</td>
            <td style="text-align:center">${badge}</td>
            <td>${actionCell}</td>
          </tr>`;
          })
          .join("");
        updateSummary();
      }

      function toggleSelectAll(checked) {
        document.querySelectorAll(".row-chk").forEach((cb) => {
          if (!cb.disabled) cb.checked = checked;
        });
        updateSummary();
      }

      function updateSummary() {
        const checked = [...document.querySelectorAll(".row-chk:checked")].filter(
          (cb) => !cb.disabled,
        );
        const weight = checked.reduce(
          (s, cb) => s + Number.parseFloat(cb.dataset.weight || 0),
          0,
        );
        document.getElementById("selCount").textContent = checked.length;
        document.getElementById("selWeight").textContent = weight.toFixed(3);
        const selectable = document.querySelectorAll(".row-chk:not([disabled])");
        const sa = document.getElementById("selectAll");
        if (sa)
          sa.checked =
            selectable.length > 0 && checked.length === selectable.length;
        document
          .getElementById("createInvoiceBtn")
          .classList.toggle("visible", checked.length > 0);
      }

      // ── Invoice Modal ──
      function openInvoiceModal() {
        if (!document.querySelectorAll(".row-chk:checked").length) return;
        document.getElementById("invDate").value = new Date()
          .toISOString()
          .slice(0, 10);
        // Per-company invoice number derived from DB (allData)
        const _firstChecked = [...document.querySelectorAll(".row-chk:checked")][0];
        const _invCompany = _firstChecked?.dataset.company || "";
        let _suggestNo;
        if (_editingId) {
          // Edit: restore exact number, date, gold rate, pct from DB via allData
          const _editRow = allData.find((r) => String(r.id) === String(_editingId));
          _suggestNo = parseMcBillNum(_editRow?.mc_receipt_bill_no) || 1;
          if (_editRow?.mc_receipt_date) {
            document.getElementById("invDate").value = String(_editRow.mc_receipt_date).slice(0, 10);
          }
          document.getElementById("invGoldRate").value = _editRow?.mc_gold_rate || "";
          document.getElementById("invPct").value = _editRow?.mc_pct || localStorage.getItem(`mc_last_pct_${_invCompany}`) || "3.5";
        } else {
          // New: next number = max existing MC number for this company + 1
          const _maxNo = Math.max(0, ...allData
            .filter((r) => r.company_name === _invCompany && r.mc_receipt_bill_no)
            .map((r) => parseMcBillNum(r.mc_receipt_bill_no))
          );
          _suggestNo = _maxNo + 1;
          const _defaultPct = /namachivayam/i.test(_invCompany) ? "3" : "3.5";
          document.getElementById("invGoldRate").value = "";
          document.getElementById("invPct").value = localStorage.getItem(`mc_last_pct_${_invCompany}`) || _defaultPct;
        }
        document.getElementById("invNo").value = _suggestNo;
        document.getElementById("invFineWeight").value = "";
        refreshPreview();
        document.getElementById("invoiceDialog").showModal();
        setTimeout(() => document.getElementById("invGoldRate").focus(), 100);
      }

      let _editingId = null;

      function closeInvoiceModal() {
        document.getElementById("invoiceDialog").close();
        _editingId = null;
      }

      // Close on backdrop click (click lands on the <dialog> element itself)
      document
        .getElementById("invoiceDialog")
        .addEventListener("click", (e) => {
          if (e.target === document.getElementById("invoiceDialog"))
            closeInvoiceModal();
        });

      function refreshPreview() {
        const checked = [...document.querySelectorAll(".row-chk:checked")];
        const totalWeight = checked.reduce(
          (s, cb) => s + Number.parseFloat(cb.dataset.weight || 0),
          0,
        );
        const goldRate =
          Number.parseFloat(document.getElementById("invGoldRate").value) || 0;
        const pct =
          Number.parseFloat(document.getElementById("invPct").value) || 0;
        const el = document.getElementById("invPreview");

        if (!goldRate || !pct) {
          el.style.color = "var(--ink-3)";
          el.textContent = `${checked.length} voucher(s) · ${totalWeight.toFixed(3)} g — enter gold rate and percentage to preview.`;
          return;
        }
        const ratePerGram = (pct / 100) * (goldRate / 10);
        const subtotal = totalWeight * ratePerGram;
        const rounded = Math.round(subtotal);
        const roundOff = rounded - subtotal;
        el.style.color = "var(--ink-2)";
        const rows = checked
          .map(
            (cb) =>
              `<div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11.5px;padding:2px 0;"><span>${cb.dataset.issue || "—"}</span><span>${Number.parseFloat(cb.dataset.weight || 0).toFixed(3)} g</span></div>`,
          )
          .join("");
        el.style.color = "var(--ink-2)";
        el.innerHTML = `
          <div style="margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--border);">${rows}</div>
          <div><b>${checked.length}</b> voucher(s) &nbsp;·&nbsp; <b>${totalWeight.toFixed(3)} g</b></div>
          <div style="margin-top:2px;">Rate: <b>₹${ratePerGram.toFixed(2)}/g</b> &nbsp;(${pct}% of ₹${Number(goldRate).toLocaleString("en-IN")}/10g)</div>
          <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">
            Making charges: <b>₹${subtotal.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b>
            &nbsp;·&nbsp; Round off: ₹${roundOff.toFixed(2)}
            &nbsp;·&nbsp; <b style="color:#c0186a;">Total: ₹${rounded.toLocaleString("en-IN")}</b>
          </div>`;
      }

      async function generateInvoice() {
        const invDate = document.getElementById("invDate").value;
        const goldRate = Number.parseFloat(
          document.getElementById("invGoldRate").value,
        );
        const pct = Number.parseFloat(document.getElementById("invPct").value);
        const invNoInput = Number.parseInt(
          document.getElementById("invNo").value,
          10,
        );
        if (!invDate) {
          alert("Please enter invoice date.");
          return;
        }
        if (!goldRate || goldRate <= 0) {
          alert("Please enter a valid gold rate.");
          return;
        }
        if (!pct || pct <= 0) {
          alert("Please enter a valid percentage.");
          return;
        }

        const checked = [...document.querySelectorAll(".row-chk:checked")];
        if (!checked.length) {
          alert("No vouchers selected.");
          return;
        }
        if (!_allowRegenerate) {
          const alreadyGen = checked.filter((cb) => isGenerated(cb.dataset.id));
          if (alreadyGen.length) {
            alert(
              `${alreadyGen.length} voucher(s) already have an MC bill generated.\nUse the Edit button to modify an existing bill.`,
            );
            return;
          }
        }
        _allowRegenerate = false;

        // Sender info from profile data in allData
        const firstId = Number.parseInt(checked[0].dataset.id, 10);
        const profile = allData.find((r) => r.id === firstId) || {};
        const senderName = profile.company_name || "—";
        const senderCity = [profile.city, profile.pincode]
          .filter(Boolean)
          .join(" - ");
        const senderPan = profile.pan_number || "";

        const _company = checked[0]?.dataset.company || "";
        localStorage.setItem(`mc_last_pct_${_company}`, String(pct));
        const _prefix = getMcPrefix(_company);
        const mcBillNo = `${_prefix}${String(invNoInput || 1).padStart(2, "0")}`;

        const ratePerGram = (pct / 100) * (goldRate / 10);
        const vouchers = checked.map((cb) => ({
          id: cb.dataset.id,
          issue: cb.dataset.issue,
          weight: Number.parseFloat(cb.dataset.weight || 0),
        }));
        const totalWeight = vouchers.reduce((s, v) => s + v.weight, 0);
        const fineWeight = Math.round(totalWeight * 100) / 100;
        const subtotal = parseFloat((fineWeight * ratePerGram).toFixed(2));
        const rounded = Math.round(subtotal);

        const issueNo = vouchers.map(v => v.issue).filter(Boolean).join(", ");
        const _issueRow = allData.find(r => String(r.id) === String(vouchers[0]?.id));
        const issueDate = String(_issueRow?.date || "").slice(0, 10);
        const roundOff = parseFloat((rounded - subtotal).toFixed(2));

        const html = buildBillHtml({
          senderName, senderCity, senderPan,
          mcBillNo, invDate, issueNo, issueDate, fineWeight, ratePerGram,
          subtotal, roundOff, rounded, goldRate, pct,
        });

        // ── Save bill photo + create/update receipt voucher ──
        const genBtn = document.querySelector(
          '.btn-generate[onclick="generateInvoice()"]',
        );
        if (genBtn) {
          genBtn.disabled = true;
          genBtn.textContent = "Saving…";
        }
        const voucherIds = vouchers.map((v) => v.id);
        const editId = _editingId;
        _editingId = null;

        const billParams = {
          invDate,
          mcBillNo,
          fineWeight,
          ratePerGram,
          subtotal,
          roundOff,
          rounded,
          goldRate,
          pct,
          photoUrl: null,
        };
        let _finalReceiptId = null;

        try {
          // 1. Capture & upload bill photo
          try {
            const dataUrl = await captureBillAsImage(html);
            billParams.photoUrl = await uploadMcBillPhoto(
              dataUrl,
              `mc_${String(invNoInput || 1).padStart(2, "0")}_${invDate.replace(/-/g, "")}_${Date.now()}`,
            );
          } catch (e) {
            console.warn("[MC] Photo upload failed:", e.message);
          }

          if (editId) {
            // 2a. Edit: update existing receipt voucher
            // Get receiptId from DB (allData) first, fall back to localStorage
            const _editRow = allData.find((r) => String(r.id) === String(editId));
            const stored = getMcBillData(editId);
            const receiptId = _editRow?.mc_receipt_id || stored?.receiptId;
            if (receiptId) {
              try {
                await updateReceiptVoucher(receiptId, billParams);
                setMcBillData(editId, {
                  receiptId,
                  photoUrl: billParams.photoUrl || stored?.photoUrl,
                  invNo: billParams.invNo,
                  goldRate: billParams.goldRate,
                  pct: billParams.pct,
                });
                _finalReceiptId = receiptId;
              } catch (e) {
                console.warn("[MC] Receipt update failed:", e.message);
              }
            }
          } else {
            // 2b. New: create receipt voucher, store IDs for all selected vouchers
            try {
              const receiptId = await saveReceiptVoucher(voucherIds, billParams);
              _finalReceiptId = receiptId;
              voucherIds.forEach((id) =>
                setMcBillData(id, {
                  receiptId,
                  photoUrl: billParams.photoUrl,
                  invNo: billParams.invNo,
                  goldRate: billParams.goldRate,
                  pct: billParams.pct,
                }),
              );
            } catch (e) {
              console.warn("[MC] Receipt create failed:", e.message);
            }
          }
        } finally {
          if (genBtn) {
            genBtn.disabled = false;
            genBtn.textContent = "Generate & Print →";
          }
        }

        // Mark as generated (DB-backed via allData), close modal, refresh table, open print
        if (_finalReceiptId) markGenerated(voucherIds, _finalReceiptId, {
          mc_receipt_bill_no: mcBillNo,
          mc_gold_rate: goldRate,
          mc_pct: pct,
          mc_receipt_date: invDate,
        });
        closeInvoiceModal();
        renderTable();

        const w = window.open("", "_blank");
        w.document.write(html);
        w.document.close();
      }

        const ratePerGram = (pct / 100) * (goldRate / 10);
        const fineWeight = Math.round(weight * 100) / 100;
        const subtotal = parseFloat((fineWeight * ratePerGram).toFixed(2));
        const rounded = Math.round(subtotal);
        const roundOff = parseFloat((rounded - subtotal).toFixed(2));
        const fmtAmt = (n) =>
          Number(n).toLocaleString("en-IN", {

            maximumFractionDigits: 2,
          });

        el.style.color = "var(--ink-2)";
        el.innerHTML = `

      // ── Capture rendered bill HTML as JPEG via html2canvas (A4: 794×1123px) ──
      async function captureBillAsImage(htmlString) {
        return new Promise((resolve, reject) => {
          const iframe = document.createElement("iframe");
          iframe.style.cssText =
            "position:fixed;left:-9999px;top:0;width:794px;height:1123px;border:none;overflow:hidden;";
          iframe.setAttribute("scrolling", "no");
          document.body.appendChild(iframe);
          const timer = setTimeout(() => {
            document.body.removeChild(iframe);
            reject(new Error("iframe capture timeout"));
          }, 15000);
          iframe.onload = async () => {
            clearTimeout(timer);
            try {
              // Hide print button — not part of the saved image
              const hideStyle = iframe.contentDocument.createElement("style");
              hideStyle.textContent = ".no-print{display:none!important;}";
              iframe.contentDocument.head.appendChild(hideStyle);
              if (iframe.contentDocument?.fonts)
                await iframe.contentDocument.fonts.ready;
              await new Promise((r) => setTimeout(r, 400));
              const canvas = await html2canvas(
                iframe.contentDocument.body,
                {
                  scale: 2,
                  useCORS: true,
                  logging: false,
                  width: 794,
                  height: 1123,
                  windowWidth: 794,
                  windowHeight: 1123,
                },
              );
              document.body.removeChild(iframe);
              resolve(canvas.toDataURL("image/jpeg", 0.92));
            } catch (e) {
              document.body.removeChild(iframe);
              reject(e);
            }
          };
          iframe.srcdoc = htmlString;
        });
      }

      async function openMcBillWindow(id) {
        const row = allData.find((r) => String(r.id) === String(id));
        const billData = getMcBillData(id);
        const receiptId = row?.mc_receipt_id || billData?.receiptId;
        if (!receiptId) {
          alert("No saved MC bill found for this voucher.");
          return;
        }
        try {
          const res = await fetch(`/api/labour/${receiptId}`);
          if (!res.ok) throw new Error();
          const d = await res.json();
          const l = d.labour;
          const items = d.items || [];
          const invDate = String(row?.mc_receipt_date || l.date || new Date().toISOString()).slice(0, 10);
          const _storedNum = parseMcBillNum(l.receipt_bill_no) || 1;
          const mcBillNo = `${getMcPrefix(row?.company_name || "")}${String(_storedNum).padStart(2, "0")}`;

          const fineWeight = Number.parseFloat(items[0]?.quantity || 0);
          const ratePerGram = Number.parseFloat(items[0]?.rate || 0);
          const subtotal = Number.parseFloat(l.taxable_total ?? items[0]?.amount ?? 0);
          const rounded = Number.parseFloat(l.total || 0);
          const roundOff = Number.parseFloat(l.round_off || 0);
          const goldRate = Number(l.gold_rate) || billData?.goldRate || 0;
          const pct = Number(l.mc_pct) || billData?.pct || 0;
          const senderName = row?.company_name || l.company_name || "—";
          const senderCity = [row?.city, row?.pincode].filter(Boolean).join(" - ");
          const senderPan = row?.pan_number || "";
          const issueNo = row?.issue_number || "";
          const issueDate = String(row?.date || "").slice(0, 10);
          const html = buildBillHtml({ senderName, senderCity, senderPan, mcBillNo, invDate, issueNo, issueDate, fineWeight, ratePerGram, subtotal, roundOff, rounded, goldRate, pct });
          const w = window.open("", "_blank");
          w.document.write(html);
          w.document.close();
        } catch {
          alert("Failed to load MC bill data.");
        }
      }

      async function saveReceiptVoucher(labourIds, { invDate, mcBillNo, fineWeight, ratePerGram, subtotal, roundOff, rounded, photoUrl, goldRate, pct }) {
        const payload = {
          is_mc: true,
          labour_ids: labourIds.map(Number),
          closing_date: invDate,
          bill_no: mcBillNo,
          taxable_total: subtotal,
          round_off: roundOff,
          total: rounded,
          tds: 0,
          bill_value_after_deduction: rounded,
          photo_url: photoUrl || null,
          gold_rate: goldRate || null,
          mc_pct: pct || null,
          items: [
            {
              sl_no: 1,
              description: "Making Charges",
              quantity: Number.parseFloat(fineWeight.toFixed(2)),
              rate: Number.parseFloat(ratePerGram.toFixed(2)),
              tax_percent: 0,
              amount: subtotal,
            },
          ],
        };
        const res = await fetch("/api/close-issue-voucher", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error((await res.json()).error || "Failed to create receipt voucher");
        return (await res.json()).id;
      }

      async function updateReceiptVoucher(receiptId, { invDate, mcBillNo, fineWeight, ratePerGram, subtotal, roundOff, rounded, photoUrl, goldRate, pct }) {
        const billNo = mcBillNo;
        // PATCH first — simple direct update with no transaction, guarantees date/rates/photo are saved.
        // Server deletes the old Cloudinary photo if a new one is provided.
        const patchRes = await fetch(`/api/labour/${receiptId}/mc`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: invDate, receipt_bill_no: billNo, gold_rate: goldRate || null, mc_pct: pct || null, photo_url: photoUrl || null }),
        });
        if (!patchRes.ok) throw new Error("Failed to update MC bill date");
        // PUT updates amounts + items (non-fatal if this part fails — date is already saved above)
        try {
          await fetch(`/api/labour/${receiptId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              date: invDate,
              receipt_bill_no: billNo,
              taxable_total: subtotal,
              round_off: roundOff,
              total: rounded,
              tds: 0,
              bill_value_after_deduction: rounded,
              photo_url: photoUrl || null,
              gold_rate: goldRate || null,
              mc_pct: pct || null,
              items: [{
                sl_no: 1, description: "Making Charges",
                quantity: Number.parseFloat(fineWeight.toFixed(2)),
                rate: Number.parseFloat(ratePerGram.toFixed(2)),
                tax_percent: 0, amount: subtotal,
              }],
            }),
          });
        } catch (e) {
          console.warn("[MC] Items PUT failed (date already saved):", e.message);
        }
      }
